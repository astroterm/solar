operatorNamespace: rook-system

cephClusterSpec:
  storage:
    useAllNodes: true
    useAllDevices: false
    devicePathFilter: ^/dev/disk/by-partlabel/r-osd$

  dashboard:
    enabled: true
    ssl: false

  security:
    cephx:
      allowedCiphers: [aes256k]
      daemon:
        keyRotationPolicy: KeyGeneration
        keyGeneration: 2
      csi:
        keyRotationPolicy: KeyGeneration
        keyGeneration: 2
        keepPriorKeyCountMax: 0
        keyType: aes256k

  cleanupPolicy:
    wipeDevicesFromOtherClusters: true

toolbox:
  enabled: true

cephObjectStores:
  - name: ceph-objectstore
    spec:
      metadataPool:
        failureDomain: host
        replicated:
          size: 3

      dataPool:
        failureDomain: host
        erasureCoded:
          dataChunks: 2
          codingChunks: 1
        parameters:
          bulk: "false"

      preservePoolsOnDelete: true

      gateway:
        port: 80
        instances: 1
        priorityClassName: system-cluster-critical

    storageClass:
      enabled: true
      name: ceph-bucket