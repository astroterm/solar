---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cloudnative-pg
spec:
  targetNamespace: &namespace database

  path: ./kubernetes/infra/database/cloudnative-pg/app

  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: *app
    namespace: *namespace
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-cluster
spec:
  targetNamespace: database

  path: ./kubernetes/infra/database/cloudnative-pg/cluster
  
  dependsOn:
  - name: cloudnative-pg
