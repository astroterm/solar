apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler

  target:
    name: cnpg-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "{{ .USERNAME }}"
        password: "{{ .PASSWORD }}"

  dataFrom:
  - find:
      name:
        regexp: "^postgres/.*"
    rewrite:
    - regexp:
        source: "^postgres/(.*)"
        target: "$1"